name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify source checkout (unavailable dataset checks are explicitly skipped)
        run: ./mvnw -B verify -Dwowforever.music.enabled=false -Dwowforever.sound.enabled=false
        shell: bash
      - name: Package source-only application
        run: ./mvnw -B -Psource-only -pl app -am clean package -DskipTests
        shell: bash
      - name: Audit source-only application
        run: java packaging/ArchiveAudit.java app/target/wow-forever-browser.jar
        shell: bash
      # Native database self-tests belong to the manual portable workflow, which
      # receives explicit hash-pinned datasets. Source CI uploads no application.
