name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
        shell: bash
      - name: Self-test the packaged jar
        run: java -jar app/target/wow-forever-browser.jar --self-test
        shell: bash
      # The populated development JAR contains archived source/media assets.
      # CI verifies it but must not upload it. Reviewed portable release artifacts
      # have a separate, explicit publication decision; see docs/releases/README.md.
