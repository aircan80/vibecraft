# Dark colour tokens (bg.base, bg.surface, bg.raised, text.primary, text.muted, accent.gold, link, warn)
@background = #12161D
@foreground = #E4E1D8
@accentColor = #D6B25E
@surface = #1B2027
@raised = #242A33
@muted = #8E97A5
@warnColor = #E0A83A

Component.linkColor = #9CC3E6
Component.focusWidth = 2
Component.focusColor = @accentColor
Component.arc = 6
TextComponent.arc = 6
Button.arc = 6

Panel.background = @background
List.background = @surface
Table.background = @surface
Tree.background = @surface
TextField.background = @surface
TextArea.background = @surface
ComboBox.background = @surface
# alternate row and selection are Tokens.DARK altRow and selection: epic text stays at least 4.5:1 on them
Table.alternateRowColor = #1E232B
Table.selectionBackground = #29230F
Table.selectionInactiveBackground = #29230F
Label.disabledForeground = @muted
