# Parchment colour tokens (base, surface, raised, text, muted, gold, link, warn); Tokens.PARCHMENT holds the same
@background = #F3E9D2
@foreground = #2B2416
@accentColor = #8A6D1E
@surface = #EADCBB
@raised = #FBF5E6
@muted = #6B5E45
@warnColor = #8A5A00

Component.linkColor = #1F4E8C
Component.focusWidth = 2
Component.focusColor = @accentColor
Component.arc = 6
TextComponent.arc = 6
Button.arc = 6

Panel.background = @background
# tables, lists and text fields sit on raised: on surface poor, uncommon, legendary and gold text are under 4.5:1
List.background = @raised
Table.background = @raised
Tree.background = @raised
TextField.background = @raised
TextArea.background = @raised
ComboBox.background = @raised
# alternate row and selection are Tokens.PARCHMENT altRow and selection: every quality colour stays at least 4.5:1
Table.alternateRowColor = #F6EEDC
Table.selectionBackground = #FDEDB4
Table.selectionInactiveBackground = #FDEDB4
# selected-row text: FlatLaf's accent-derived default is white (#FFFFFF, 1.2:1 on #FDEDB4)
Table.selectionForeground = @foreground
Table.selectionInactiveForeground = @foreground
Label.disabledForeground = @muted
