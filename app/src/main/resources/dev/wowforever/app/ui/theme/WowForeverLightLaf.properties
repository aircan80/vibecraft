# Light colour tokens (bg.base, bg.surface, bg.raised, text.primary, text.muted, accent.gold, link)
@background = #F4F5F7
@foreground = #1C1F24
@accentColor = #9A7419
@surface = #FFFFFF
@raised = #E9ECF0
@muted = #5C6470

Component.linkColor = #1F5FA8
Component.focusWidth = 2
Component.arc = 6
TextComponent.arc = 6
Button.arc = 6

Panel.background = @background
List.background = @surface
Table.background = @surface
Tree.background = @surface
TextField.background = @surface
TextArea.background = @surface
ComboBox.background = @surface
Table.alternateRowColor = @raised
Table.selectionBackground = #EADFC0
Table.selectionInactiveBackground = @raised
Label.disabledForeground = @muted
